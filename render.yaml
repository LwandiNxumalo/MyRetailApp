services:
  - type: web
    name: basketradar-api
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: basketradar-db
          property: connectionString

databases:
  - name: basketradar-db
    databaseName: basketradar
    user: basketradar_user